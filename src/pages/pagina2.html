<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Vinharia Agnello</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/efeitos.css">
</head>
<body>
  <header>
    <h1 class="logo">Vinharia Agnello</h1>
    <nav>
      <ul class="menu">
        <li><a href="../../index.html">Início</a></li>
        <li><a href="pagina1.html">Sobre</a></li>
        <li><a href="pagina2.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="conteudo">
    <h2>Fale com a Vinharia Agnello</h2>
    <form class="formulario">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com">

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem"></textarea>

      <label class="opcao">
        <input type="checkbox" id="novidades" name="novidades">
        <span>Quero receber novidades</span>
      </label>

      <button type="submit" class="botao">Enviar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Vinharia Agnello</p>
  </footer>
</body>
</html>
